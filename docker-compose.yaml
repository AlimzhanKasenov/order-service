services:

  # ============================================================
  # Order Service PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine
    container_name: order-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: users
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password

    ports:
      - "5432:5432"

    volumes:
      - order-service-postgres-data:/var/lib/postgresql/data
      - ./migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ./migrations/002_add_authentication.sql:/docker-entrypoint-initdb.d/002_add_authentication.sql:ro
      - ./migrations/003_create_orders.sql:/docker-entrypoint-initdb.d/003_create_orders.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U order_user -d users
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # Order Service
  # ============================================================
  order-service:
    build:
      context: .

    container_name: order-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8000"

      SERVICE_NAME: order-service
      LOG_LEVEL: INFO

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: users
      DB_SSLMODE: disable
      DB_USERNAME: order_user
      DB_PASSWORD: order_password

      JWT_SECRET: local-development-jwt-secret-change-me-123456789
      JWT_ISSUER: order-service
      JWT_TTL: 1h

      KAFKA_BROKER: kafka:29092

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy


  # ============================================================
  # Billing Service PostgreSQL
  # ============================================================
  billing-postgres:
    image: postgres:17-alpine
    container_name: billing-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing_user
      POSTGRES_PASSWORD: billing_password

    ports:
      - "5433:5432"

    volumes:
      - billing-service-postgres-data:/var/lib/postgresql/data
      - ./services/billing-service/migrations/001_create_accounts.sql:/docker-entrypoint-initdb.d/001_create_accounts.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U billing_user -d billing
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # Billing Service
  # ============================================================
  billing-service:
    build:
      context: ./services/billing-service

    container_name: billing-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8001"

      DB_HOST: billing-postgres
      DB_PORT: "5432"
      DB_NAME: billing
      DB_SSLMODE: disable
      DB_USERNAME: billing_user
      DB_PASSWORD: billing_password

      KAFKA_BROKER: kafka:29092

    ports:
      - "8001:8001"

    depends_on:
      billing-postgres:
        condition: service_healthy


  # ============================================================
  # Notification Service PostgreSQL
  # ============================================================
  notification-postgres:
    image: postgres:17-alpine
    container_name: notification-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password

    ports:
      - "5434:5432"

    volumes:
      - notification-service-postgres-data:/var/lib/postgresql/data
      - ./services/notification-service/migrations/001_create_notifications.sql:/docker-entrypoint-initdb.d/001_create_notifications.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U notification_user -d notifications
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # Notification Service
  # ============================================================
  notification-service:
    build:
      context: ./services/notification-service

    container_name: notification-service
    restart: unless-stopped

    environment:
      SERVER_PORT: "8002"

      DB_HOST: notification-postgres
      DB_PORT: "5432"
      DB_NAME: notifications
      DB_SSLMODE: disable
      DB_USERNAME: notification_user
      DB_PASSWORD: notification_password

      KAFKA_BROKER: kafka:29092

    ports:
      - "8002:8002"

    depends_on:
      notification-postgres:
        condition: service_healthy



  # ============================================================
  # Kafka
  # ============================================================
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_NUM_PARTITIONS: "1"


volumes:
  order-service-postgres-data:
  billing-service-postgres-data:
  notification-service-postgres-data:
