apiVersion: v1
kind: Secret
metadata:
  name: order-service-db-secret
type: Opaque
stringData:
  # Доступы приложения к PostgreSQL.
  DB_USERNAME: order_user
  DB_PASSWORD: order_password

  # Доступы Helm-чарта PostgreSQL.
  postgres-password: postgres_admin_password
  password: order_password

  # Секрет подписи JWT.
  #
  # Для учебного окружения значение хранится здесь.
  # В production Secret должен создаваться внешней системой
  # управления секретами и не храниться в Git.
  JWT_SECRET: homework-jwt-secret-order-service-2026-change-me
