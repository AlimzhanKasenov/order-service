apiVersion: v1
kind: ConfigMap
metadata:
  name: order-postgres-init
  namespace: distributed-transactions
data:
  001_create_users.sql: |
    CREATE TABLE IF NOT EXISTS users
    (
        id BIGSERIAL PRIMARY KEY,
        username VARCHAR(100) NOT NULL UNIQUE,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        email VARCHAR(255) NOT NULL UNIQUE,
        phone VARCHAR(50) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

  002_add_authentication.sql: |
    ALTER TABLE users
        ADD COLUMN IF NOT EXISTS password_hash VARCHAR(100);

  003_create_orders.sql: |
    CREATE TABLE IF NOT EXISTS orders
    (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        price BIGINT NOT NULL CHECK (price > 0),
        status VARCHAR(30) NOT NULL DEFAULT 'NEW',
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT orders_user_fk
            FOREIGN KEY (user_id)
            REFERENCES users(id)
            ON DELETE CASCADE,

        CONSTRAINT orders_status_check
            CHECK (status IN ('NEW', 'PAID', 'PAYMENT_FAILED'))
    );

    CREATE INDEX IF NOT EXISTS idx_orders_user_id
        ON orders(user_id);

    CREATE INDEX IF NOT EXISTS idx_orders_status
        ON orders(status);

  004_add_saga_fields.sql: |
    ALTER TABLE orders
        ADD COLUMN IF NOT EXISTS product_id BIGINT,
        ADD COLUMN IF NOT EXISTS quantity BIGINT,
        ADD COLUMN IF NOT EXISTS delivery_slot TIMESTAMP WITH TIME ZONE,
        ADD COLUMN IF NOT EXISTS saga_error TEXT;

    ALTER TABLE orders
    DROP CONSTRAINT IF EXISTS orders_status_check;

    ALTER TABLE orders
        ADD CONSTRAINT orders_status_check
            CHECK (
                status IN (
                    'NEW',
                    'PAID',
                    'PAYMENT_FAILED',
                    'SAGA_STARTED',
                    'CONFIRMED',
                    'SAGA_FAILED',
                    'COMPENSATION_FAILED'
                )
            );

    ALTER TABLE orders
    DROP CONSTRAINT IF EXISTS orders_product_id_check;

    ALTER TABLE orders
        ADD CONSTRAINT orders_product_id_check
            CHECK (
                product_id IS NULL
                OR product_id > 0
            );

    ALTER TABLE orders
    DROP CONSTRAINT IF EXISTS orders_quantity_check;

    ALTER TABLE orders
        ADD CONSTRAINT orders_quantity_check
            CHECK (
                quantity IS NULL
                OR quantity > 0
            );
  005_create_outbox_inbox.sql: |
    -- Автор: Kassenov Alimzhan
    -- Transactional Outbox + Inbox для Order Service.

    CREATE TABLE IF NOT EXISTS outbox_events
    (
        id           BIGSERIAL PRIMARY KEY,
        event_id     VARCHAR(64)  NOT NULL UNIQUE,
        topic        VARCHAR(255) NOT NULL,
        event_key    VARCHAR(255) NOT NULL,
        payload      JSONB        NOT NULL,
        status       VARCHAR(20)  NOT NULL DEFAULT 'PENDING',
        attempts     INTEGER      NOT NULL DEFAULT 0,
        last_error   TEXT,
        created_at   TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP,
        published_at TIMESTAMPTZ,

        CONSTRAINT outbox_events_status_check
            CHECK (status IN ('PENDING', 'PUBLISHED')),

        CONSTRAINT outbox_events_attempts_check
            CHECK (attempts >= 0)
    );

    CREATE INDEX IF NOT EXISTS idx_outbox_events_pending
        ON outbox_events (id)
        WHERE status = 'PENDING';

    CREATE TABLE IF NOT EXISTS inbox_events
    (
        event_id     VARCHAR(64)  PRIMARY KEY,
        topic        VARCHAR(255) NOT NULL,
        processed_at TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-postgres
  namespace: distributed-transactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
  template:
    metadata:
      labels:
        app: order-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          env:
            - name: POSTGRES_DB
              value: users

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: ORDER_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: ORDER_DB_PASSWORD

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U order_user -d users
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U order_user -d users
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: init-scripts
          configMap:
            name: order-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: order-postgres
  namespace: distributed-transactions
spec:
  selector:
    app: order-postgres
  ports:
    - port: 5432
      targetPort: 5432
