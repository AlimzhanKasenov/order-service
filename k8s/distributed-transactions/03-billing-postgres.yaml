apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-postgres-init
  namespace: distributed-transactions
data:
  001_create_accounts.sql: |
    CREATE TABLE IF NOT EXISTS accounts
    (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL UNIQUE,
        balance BIGINT NOT NULL DEFAULT 0 CHECK (balance >= 0),
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_accounts_user_id
        ON accounts(user_id);
  002_create_outbox_inbox.sql: |
    -- Автор: Kassenov Alimzhan
    -- Transactional Outbox + Inbox для Billing Service.

    CREATE TABLE IF NOT EXISTS outbox_events
    (
        id           BIGSERIAL PRIMARY KEY,
        event_id     VARCHAR(64)  NOT NULL UNIQUE,
        topic        VARCHAR(255) NOT NULL,
        event_key    VARCHAR(255) NOT NULL,
        payload      JSONB        NOT NULL,
        status       VARCHAR(20)  NOT NULL DEFAULT 'PENDING',
        attempts     INTEGER      NOT NULL DEFAULT 0,
        last_error   TEXT,
        created_at   TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP,
        published_at TIMESTAMPTZ,

        CONSTRAINT outbox_events_status_check
            CHECK (status IN ('PENDING', 'PUBLISHED')),

        CONSTRAINT outbox_events_attempts_check
            CHECK (attempts >= 0)
    );

    CREATE INDEX IF NOT EXISTS idx_outbox_events_pending
        ON outbox_events (id)
        WHERE status = 'PENDING';

    CREATE TABLE IF NOT EXISTS inbox_events
    (
        event_id     VARCHAR(64)  PRIMARY KEY,
        topic        VARCHAR(255) NOT NULL,
        processed_at TIMESTAMPTZ  NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-postgres
  namespace: distributed-transactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-postgres
  template:
    metadata:
      labels:
        app: billing-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          env:
            - name: POSTGRES_DB
              value: billing

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: BILLING_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: BILLING_DB_PASSWORD

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U billing_user -d billing
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U billing_user -d billing
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: init-scripts
          configMap:
            name: billing-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  namespace: distributed-transactions
spec:
  selector:
    app: billing-postgres
  ports:
    - port: 5432
      targetPort: 5432
