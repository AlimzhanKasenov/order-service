apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-postgres-init
  namespace: distributed-transactions
data:
  001_create_delivery.sql: |
    CREATE TABLE IF NOT EXISTS delivery_couriers
    (
        id BIGSERIAL PRIMARY KEY,
        name TEXT NOT NULL,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE TABLE IF NOT EXISTS delivery_reservations
    (
        id BIGSERIAL PRIMARY KEY,
        order_id BIGINT NOT NULL UNIQUE,
        courier_id BIGINT NOT NULL,
        delivery_slot TIMESTAMP WITH TIME ZONE NOT NULL,
        status VARCHAR(32) NOT NULL DEFAULT 'RESERVED',
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT delivery_reservations_courier_fk
            FOREIGN KEY (courier_id)
            REFERENCES delivery_couriers (id),

        CONSTRAINT delivery_reservations_order_id_check
            CHECK (order_id > 0),

        CONSTRAINT delivery_reservations_status_check
            CHECK (
                status IN (
                    'RESERVED',
                    'RELEASED'
                )
            )
    );

    CREATE UNIQUE INDEX IF NOT EXISTS idx_delivery_active_slot
        ON delivery_reservations
        (
            courier_id,
            delivery_slot
        )
        WHERE status = 'RESERVED';

    CREATE INDEX IF NOT EXISTS idx_delivery_reservations_order
        ON delivery_reservations (order_id);

    CREATE INDEX IF NOT EXISTS idx_delivery_reservations_slot
        ON delivery_reservations (delivery_slot);

    INSERT INTO delivery_couriers
    (
        id,
        name,
        active
    )
    VALUES
        (
            1,
            'Учебный курьер',
            TRUE
        )
    ON CONFLICT (id) DO NOTHING;

    SELECT setval(
        pg_get_serial_sequence(
            'delivery_couriers',
            'id'
        ),
        GREATEST(
            (
                SELECT COALESCE(
                    MAX(id),
                    1
                )
                FROM delivery_couriers
            ),
            1
        ),
        true
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-postgres
  namespace: distributed-transactions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-postgres
  template:
    metadata:
      labels:
        app: delivery-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          env:
            - name: POSTGRES_DB
              value: delivery

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: DELIVERY_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: DELIVERY_DB_PASSWORD

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U delivery_user -d delivery
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U delivery_user -d delivery
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: init-scripts
          configMap:
            name: delivery-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-postgres
  namespace: distributed-transactions
spec:
  selector:
    app: delivery-postgres
  ports:
    - port: 5432
      targetPort: 5432
