apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: distributed-transactions
spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: alimzhankassenov/notification-service:1.0.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8002

          env:
            - name: SERVER_PORT
              value: "8002"

            - name: DB_HOST
              value: notification-postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: notifications

            - name: DB_SSLMODE
              value: disable

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: NOTIFICATION_DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-transactions-secrets
                  key: NOTIFICATION_DB_PASSWORD

            - name: KAFKA_BROKER
              value: kafka:29092

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: distributed-transactions
spec:
  selector:
    app: notification-service

  ports:
    - port: 8002
      targetPort: 8002
