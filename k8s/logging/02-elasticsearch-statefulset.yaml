apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
  labels:
    app: elasticsearch
    component: logging
spec:
  serviceName: elasticsearch-headless
  replicas: 1

  selector:
    matchLabels:
      app: elasticsearch

  template:
    metadata:
      labels:
        app: elasticsearch
        component: logging

    spec:
      terminationGracePeriodSeconds: 120

      securityContext:
        fsGroup: 1000

      initContainers:
        - name: configure-sysctl
          image: busybox:1.37
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -c
            - |
              sysctl -w vm.max_map_count=262144

          securityContext:
            privileged: true
            runAsUser: 0

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi

      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
          imagePullPolicy: IfNotPresent

          env:
            - name: node.name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: cluster.name
              value: order-service-logging

            - name: discovery.type
              value: single-node

            # Для учебного локального кластера отключаем авторизацию и TLS.
            - name: xpack.security.enabled
              value: "false"

            - name: xpack.security.enrollment.enabled
              value: "false"

            # Уменьшаем потребление памяти в Minikube.
            - name: xpack.ml.enabled
              value: "false"

            - name: ingest.geoip.downloader.enabled
              value: "false"

            - name: ES_JAVA_OPTS
              value: "-Xms768m -Xmx768m"

          ports:
            - name: http
              containerPort: 9200
              protocol: TCP

            - name: transport
              containerPort: 9300
              protocol: TCP

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
        labels:
          app: elasticsearch
          component: logging

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
