apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
    component: logging
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: kibana

  template:
    metadata:
      labels:
        app: kibana
        component: logging

    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.19.19
          imagePullPolicy: IfNotPresent

          env:
            - name: SERVER_NAME
              value: kibana

            - name: SERVER_HOST
              value: "0.0.0.0"

            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'

            - name: TELEMETRY_ENABLED
              value: "false"

            - name: NODE_OPTIONS
              value: "--max-old-space-size=512"

          ports:
            - name: http
              containerPort: 5601
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi

          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120

          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: kibana-service
  namespace: logging
  labels:
    app: kibana
    component: logging
spec:
  type: NodePort

  selector:
    app: kibana

  ports:
    - name: http
      protocol: TCP
      port: 5601
      targetPort: http
      nodePort: 30601
