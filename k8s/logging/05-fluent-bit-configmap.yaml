apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app: fluent-bit
    component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Daemon                    Off
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf

        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

        storage.path              /var/lib/fluent-bit/storage
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 20M

    [INPUT]
        Name              tail
        Path              /var/log/containers/order-service-*.log
        Exclude_Path      /var/log/containers/fluent-bit-*.log
        Parser            docker
        Tag               kube.*

        DB                /var/lib/fluent-bit/tail-containers.db
        DB.Sync           Normal
        Read_from_Head    On
        Refresh_Interval  5
        Rotate_Wait       30
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*

        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.

        Merge_Log           On
        Keep_Log            Off
        Labels              On
        Annotations         Off
        Buffer_Size         0

    [OUTPUT]
        Name               es
        Match              kube.*

        Host               elasticsearch.logging.svc.cluster.local
        Port               9200
        Buffer_Size        2M

        Logstash_Format    On
        Logstash_Prefix    fluent-bit-logs
        Time_Key           @timestamp

        Generate_ID        On
        Replace_Dots       On
        Suppress_Type_Name On

        Retry_Limit        False
        Trace_Error        On

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
