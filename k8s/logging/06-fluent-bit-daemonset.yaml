apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app: fluent-bit
    component: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: fluent-bit
        component: logging

    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 30

      tolerations:
        - operator: Exists
          effect: NoSchedule

        - operator: Exists
          effect: NoExecute

      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.0.9
          imagePullPolicy: IfNotPresent

          command:
            - /fluent-bit/bin/fluent-bit

          args:
            - --config
            - /fluent-bit/etc/fluent-bit.conf

          ports:
            - name: http
              containerPort: 2020
              protocol: TCP

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true

            - name: varlog
              mountPath: /var/log
              readOnly: true

            # Нужен для разрешения ссылок контейнерных логов
            # при использовании Docker runtime в Minikube.
            - name: dockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

            - name: varlib
              mountPath: /var/lib/fluent-bit

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config

        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: dockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: Directory

        - name: varlib
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
