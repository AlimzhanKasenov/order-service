---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller-metrics
  namespace: ingress-nginx
  labels:
    monitoring: ingress-nginx
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller

  ports:
    - name: metrics
      port: 10254
      targetPort: 10254
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingress-nginx-controller
  namespace: monitoring
  labels:
    app: ingress-nginx
spec:
  namespaceSelector:
    matchNames:
      - ingress-nginx

  selector:
    matchLabels:
      monitoring: ingress-nginx

  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
