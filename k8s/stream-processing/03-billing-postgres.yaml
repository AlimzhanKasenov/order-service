apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-postgres-init
  namespace: stream-processing
data:
  001_create_accounts.sql: |
    CREATE TABLE IF NOT EXISTS accounts
    (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL UNIQUE,
        balance BIGINT NOT NULL DEFAULT 0 CHECK (balance >= 0),
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_accounts_user_id
        ON accounts(user_id);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-postgres
  namespace: stream-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-postgres
  template:
    metadata:
      labels:
        app: billing-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          env:
            - name: POSTGRES_DB
              value: billing

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: BILLING_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: BILLING_DB_PASSWORD

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U billing_user -d billing
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: init-scripts
          configMap:
            name: billing-postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: billing-postgres
  namespace: stream-processing
spec:
  selector:
    app: billing-postgres
  ports:
    - port: 5432
      targetPort: 5432
