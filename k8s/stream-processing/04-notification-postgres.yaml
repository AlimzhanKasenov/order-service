apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-postgres-init
  namespace: stream-processing
data:
  001_create_notifications.sql: |
    CREATE TABLE IF NOT EXISTS notifications
    (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        order_id BIGINT NOT NULL,
        email VARCHAR(255) NOT NULL,
        subject VARCHAR(255) NOT NULL,
        message TEXT NOT NULL,
        status VARCHAR(20) NOT NULL,
        created_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,

        CONSTRAINT notifications_status_check
            CHECK (status IN ('SUCCESS', 'FAILED'))
    );

    CREATE INDEX IF NOT EXISTS idx_notifications_user_id
        ON notifications(user_id);

    CREATE INDEX IF NOT EXISTS idx_notifications_order_id
        ON notifications(order_id);

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-postgres
  namespace: stream-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-postgres
  template:
    metadata:
      labels:
        app: notification-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine

          env:
            - name: POSTGRES_DB
              value: notifications

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: NOTIFICATION_DB_USERNAME

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: NOTIFICATION_DB_PASSWORD

          ports:
            - containerPort: 5432

          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U notification_user -d notifications
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: init-scripts
          configMap:
            name: notification-postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
  namespace: stream-processing
spec:
  selector:
    app: notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
