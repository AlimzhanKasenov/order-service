apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stream-processing
spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: alimzhankassenov/order-service:stream-processing
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          env:
            - name: SERVER_PORT
              value: "8000"

            - name: SERVICE_NAME
              value: order-service

            - name: LOG_LEVEL
              value: INFO

            - name: DB_HOST
              value: order-postgres

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: users

            - name: DB_SSLMODE
              value: disable

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: ORDER_DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: ORDER_DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stream-processing-secrets
                  key: JWT_SECRET

            - name: JWT_ISSUER
              value: order-service

            - name: JWT_TTL
              value: 1h

            - name: KAFKA_BROKER
              value: kafka:29092

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: stream-processing
spec:
  selector:
    app: order-service

  ports:
    - port: 8000
      targetPort: 8000
